<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Detalle de {{ producto.nombre }}</title>
</head>
<body>
    <h1>Producto: {{ producto.nombre }}</h1>
    <ul>
        <li><b>ID:</b> {{ producto.id }}</li>
        <li><b>Cantidad:</b> {{ producto.cantidad }}</li>
        <li><b>Descripción:</b> {{ producto.descripcion }}</li>
    </ul>
</body>
</html>
