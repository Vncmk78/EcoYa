<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actualiza Producto</title>
</head>
<body>
    <h1>Actualizar Producto: {{ producto.nombre }}</h1>
    <form action = "/producto/update/{{ producto.id }}" method="POST">
        {% csrf_token %}
        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre" name="nombre" value="{{ producto.nombre }}"><br><br>
        
        <label for="cantidad">Cantidad:</label>
        <input type="number" id="cantidad" name="cantidad" value="{{ producto.cantidad }}"><br><br>
        
        <label for="descripcion">Descripción:</label>
        <textarea id="descripcion" name="descripcion">{{ producto.descripcion }}</textarea><br><br>
        
        <input type="submit" value="Actualizar Producto">
    </form>
</body>
</html>
