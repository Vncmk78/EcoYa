{% extends 'base.html' %}

{% block title %}Mapa - EcoYa{% endblock %}

{% block extra_head %}
<script>
    function initMap() {
        const temuco = { lat: -38.7359, lng: -72.5908 };

        const map = new google.maps.Map(document.getElementById("map"), {
            zoom: 12,
            center: temuco,
        });

        new google.maps.Marker({
            position: temuco,
            map: map,
            title: "Punto verde ubicado aquí",
        });
    }
</script>

<script src="https://maps.googleapis.com/maps/api/js?key=TU_API_KEY&callback=initMap" async defer></script>

{% endblock %}

{% block content %}
<h2>Mapa de Temuco</h2>
<p>Aquí puedes encontrar los puntos verdes de reciclaje cercanos.</p>

<div id="map" style="width:100%; height:500px; border:1px solid #ccc;"></div>
{% endblock %}
